table:
  name: organizations
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
object_relationships:
  - name: org_usage_summary
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_summary
          schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: "*"
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      columns: "*"
      check: {}
  - role: editor
    permission:
      columns: "*"
      check: {}
  - role: user
    permission:
      columns: "*"
      check: {}
update_permissions:
  - role: owner
    permission:
      columns:
        - quota_calls_allowed
        - name
      filter:
        org_members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check: {}
