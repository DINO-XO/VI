table:
  name: step_runs
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
