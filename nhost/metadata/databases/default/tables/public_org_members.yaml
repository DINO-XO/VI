table:
  name: org_members
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_root_fields: {}
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: "*"
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      columns: "*"
      check: {}
  - role: editor
    permission:
      columns: "*"
      check: {}
  - role: user
    permission:
      columns: "*"
      check: {}
update_permissions:
  - role: owner
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check: {}
delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
